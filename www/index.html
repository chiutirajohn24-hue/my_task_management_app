<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff7d20"><title>Synthesis Tasks</title><style>
:root{--o:rgb(255 125 32);--g:rgb(24 125 0);--bg:#fff8ec;--card:#fff;--ink:#12223f;--mut:#8b8577;--trk:#eadfcb;--ln:#e8dcc6}
html[data-theme=dark]{--bg:#141a15;--card:#1f2721;--ink:#f1eee6;--mut:#a7a295;--trk:#34402f;--ln:#33403a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation}
body{font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px;max-width:560px;width:100%;margin:auto;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block;flex:none}
h1{font-size:clamp(19px,5.6vw,25px);line-height:1.15}h2{font-size:20px;letter-spacing:.4px;margin:20px 20px 10px}h3{font-size:17px}h4{font-size:16px}
p{color:var(--mut);font-size:13.5px}
.top{background:linear-gradient(160deg,#ff9a4d,var(--o));border-radius:0 0 30px 30px;padding:max(env(safe-area-inset-top),22px) 20px 20px;color:#12223f}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:30px}.bar b{font-size:22px}.bar small{font-weight:600}
.tdy{font-size:14px;font-weight:700}
.me{display:flex;align-items:center;gap:14px;margin-top:8px}.me>div:last-child{min-width:0}.me p{color:#5a3a1a}
.rg{position:relative;display:grid;place-items:center;flex:none}
.rg>*:not(svg){position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.av{width:72px;height:72px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff}
.row{display:flex;gap:14px;align-items:center;padding:7px 20px}.row.on{background:rgba(24,125,0,.12)}
.c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.lst{padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.it{background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tp{display:flex;gap:14px;align-items:center}.tp>div:last-child{min-width:0}
.tp h4,.tp p{overflow-wrap:anywhere}.tp p svg{display:inline;vertical-align:-2px;margin-left:5px}
.rc{margin-top:6px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.late p{color:#e5484d}.em{padding:6px 22px}
.ab{display:flex;gap:6px;margin-top:10px}
.ab button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--c);border:1.5px solid var(--c)}
.ab .on{background:var(--c);color:#fff}
.pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 20px}
.pc{border-radius:30px;color:#fff;padding:16px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.pc p{color:rgba(255,255,255,.85)}.pc .rg b{font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:10px 4px max(env(safe-area-inset-bottom),12px);box-shadow:0 -4px 20px rgba(0,0,0,.1)}
nav button{font-size:11px;color:var(--mut);display:grid;justify-items:center;gap:3px;padding:4px 0}nav .on{color:var(--g);font-weight:700}
html[data-theme=dark] nav .on{color:#5fcf45}
nav .fab{justify-self:center;background:var(--g);color:#fff;width:58px;height:58px;border-radius:50%;margin-top:-34px;box-shadow:0 6px 16px rgba(24,125,0,.45);display:grid;place-items:center;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 16px}
.wd{text-align:center;font-style:normal;font-size:12px;color:var(--mut);padding:4px}
.d{aspect-ratio:1;border-radius:16px;background:var(--card);display:grid;align-content:center;justify-items:center;font-weight:600}
.d span{display:flex;gap:2px;height:6px}.d s{width:5px;height:5px;border-radius:50%}
.d.td{outline:2px solid var(--o)}.d.sel{background:var(--g);color:#fff}
.pn{display:flex;justify-content:space-between;align-items:center;padding:16px 14px}.pn button{padding:4px 10px}
.seg{display:flex;background:rgba(255,255,255,.45);border-radius:20px;padding:4px;margin-top:16px}.seg button{flex:1;padding:9px;border-radius:16px;font-weight:600}.seg .on{background:#fff;color:var(--g)}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}.sg div{background:var(--card);border-radius:22px;padding:14px}.sg b{font-size:25px;display:block}
.br{padding:6px 22px}.br i{display:block;height:10px;border-radius:6px;background:var(--trk);margin-top:5px;overflow:hidden}.br i s{display:block;height:100%;background:var(--g)}
.btn{background:var(--g);color:#fff;border-radius:20px;padding:13px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.o{background:var(--o)}.btn.m{background:var(--mut)}
.acts{display:flex;gap:10px;padding:18px 22px}.acts .btn{flex:1}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:30px 30px 0 0;padding:20px 22px max(env(safe-area-inset-bottom),20px);max-height:92vh;overflow:auto;display:grid;gap:10px}
.sh input,.sh select,.sh textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sh input{min-width:0}.fl{display:grid;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:center}
label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
#t{position:fixed;top:max(env(safe-area-inset-top),16px);left:50%;transform:translateX(-50%);background:#12223f;color:#fff;border:1px solid rgba(255,255,255,.25);padding:12px 18px;border-radius:16px;z-index:20;max-width:90%}
</style></head><body>
<div id="v"></div><nav id="nav"></nav>
<div class="mo" id="m" hidden><div class="sh"><h3 id="mt">New task</h3>
<input id="ft" placeholder="Task title (e.g. Install drip lines)">
<input id="fp" list="pl" placeholder="Project or client site"><datalist id="pl"></datalist>
<div class="two"><input id="fd" type="date"><input id="ftm" type="time"></div>
<select id="fr"><option value="-1">No reminder</option><option value="0">Remind at due time</option><option value="10">Remind 10 min before</option><option value="60">Remind 1 hour before</option><option value="1440">Remind 1 day before</option></select>
<textarea id="fn" rows="2" placeholder="Notes"></textarea>
<div class="acts" style="padding:0"><button class="btn" onclick="saveT()">Save task</button><button class="btn o" id="fx" onclick="delT()"><span data-i="trash" data-s="18"></span>Delete</button><button class="btn m" onclick="closeT()">Close</button></div></div></div>
<div class="mo" id="rm" hidden><div class="sh"><div class="hd"><h3 id="rt"></h3><button onclick="$('#rm').hidden=true" aria-label="Close"><span data-i="x" data-s="24"></span></button></div><p id="rs"></p>
<div id="rd" class="fl">
<label><span data-i="tool"></span>Tools used (optional)</label><textarea id="r1" rows="2" placeholder="e.g. Pipe cutter, trencher, flow meter"></textarea>
<label><span data-i="alert"></span>Challenges (optional)</label><textarea id="r2" rows="2" placeholder="What made the job difficult?"></textarea>
<label><span data-i="bulb"></span>Suggestions (optional)</label><textarea id="r3" rows="2" placeholder="What could be done better next time?"></textarea>
<label><span data-i="note"></span>Other (optional)</label><textarea id="r4" rows="2" placeholder="Anything else to record"></textarea></div>
<div id="rc" class="fl" hidden><label><span data-i="ban"></span>Reason for canceling</label><textarea id="r5" rows="3" placeholder="Why was this task canceled?"></textarea></div>
<div class="acts" style="padding:0"><button class="btn" onclick="saveRec()">Save</button><button class="btn m" onclick="saveRec(1)">Skip</button></div></div></div>
<div id="t" hidden></div>
<script src="jspdf.umd.min.js"></script>
<script>
const COMPANY='Synthesis Tasks',KEY='irritask.v1',$=s=>document.querySelector(s);
const I={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<path d="M5 20v-8M12 20V5M19 20V9"/>',bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',prog:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',tool:'<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',alert:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',note:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h5"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ST={todo:['To Do','var(--o)'],prog:['In Progress','#e8890c'],done:['Done','var(--g)'],fail:['Failed','#d64545'],cancel:['Canceled','#7d776b']};
const IC={todo:'clock',prog:'prog',done:'check',fail:'x',cancel:'ban'},OPEN=['todo','prog'],FIN=['done','fail','cancel'];
const AB=[['prog','Start'],['done','Done'],['fail','Failed'],['cancel','Cancel']];
const RL=[['tools','Tools used'],['challenges','Challenges'],['suggest','Suggestions'],['other','Other'],['reason','Reason']],RK=RL.map(r=>r[0]);
let S=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"fired":{}}'),view='home',filt='todo',cal=new Date(),rep='week',repOff=0,eid=0,recId=0,recSt='',selDay='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-');return new Date(a[0],a[1]-1,a[2])};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const short=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmt=t=>short(pd(t.date))+' '+pd(t.date).getFullYear()+(t.time?' at '+t.time:'');
const srt=a=>a.sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
const rate=a=>{const n=a.filter(t=>t.status!='cancel').length;return n?Math.round(a.filter(t=>t.status=='done').length/n*100):0};
const recTxt=t=>FIN.includes(t.status)&&t.rec?RL.filter(r=>t.rec[r[0]]&&(r[0]=='reason')==(t.status=='cancel')).map(r=>r[1]+': '+t.rec[r[0]]):[];
selDay=ymd(new Date());
if(!S.seeded){const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return ymd(x)};
S.tasks=[{id:1,title:'Site survey',project:'Greenfield Farm',date:d(-2),time:'09:00',remind:-1,status:'done',doneAt:d(-2)},{id:2,title:'Install drip lines, Block A',project:'Greenfield Farm',date:d(1),time:'08:00',remind:60,status:'prog'},{id:3,title:'Pump servicing',project:'Riverside Estate',date:d(3),time:'10:00',remind:1440,status:'todo'}];S.seeded=1;save()}
const applyTheme=()=>document.documentElement.dataset.theme=S.theme||'light';
function theme(){S.theme=S.theme=='dark'?'light':'dark';save();applyTheme();render()}

/* ---------- sound + notifications ---------- */
function chime(){try{const A=new(window.AudioContext||window.webkitAudioContext)();[[659,0],[880,.16],[1175,.32],[880,.5],[1319,.68]].forEach(([f,t])=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.connect(g);g.connect(A.destination);const s=A.currentTime+t;g.gain.setValueAtTime(.4,s);g.gain.exponentialRampToValueAtTime(.001,s+.9);o.start(s);o.stop(s+.9)})}catch(e){}}
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const when=t=>new Date(t.date+'T'+(t.time||'08:00')).getTime()-t.remind*60000;
async function sched(t){const L=LN();if(!L)return;try{await L.cancel({notifications:[{id:t.id}]});if(t.remind>=0&&OPEN.includes(t.status)&&when(t)>Date.now())await L.schedule({notifications:[{id:t.id,title:'⏰ '+t.title,body:(t.project||'Task')+', due '+fmt(t),schedule:{at:new Date(when(t)),allowWhileIdle:true},channelId:'irri',sound:'irri_alert.wav',smallIcon:'ic_stat_synth',iconColor:'#FF7D20'}]})}catch(e){}}
async function unsched(id){const L=LN();if(L)try{await L.cancel({notifications:[{id}]})}catch(e){}}
async function initN(){const L=LN();if(!L)return;try{await L.requestPermissions();await L.createChannel({id:'irri',name:'Task reminders',description:'Task alerts',importance:5,sound:'irri_alert.wav',vibration:true});S.tasks.forEach(sched)}catch(e){}}
async function alerts(){await initN();chime();toast('Alerts on. This is your reminder sound.')}
setInterval(()=>{if(LN())return;const n=Date.now();S.tasks.forEach(t=>{if(t.remind<0||!OPEN.includes(t.status))return;const w=when(t),k=t.id+'_'+w;if(w<=n&&n-w<6e5&&!S.fired[k]){S.fired[k]=1;save();chime();toast('⏰ '+t.title,8000)}})},15000);
let tt;function toast(m,ms=3500){const e=$('#t');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,ms)}

/* ---------- shared ui ---------- */
const ring=(p,z,col)=>{const r=z/2-6,L=2*Math.PI*r;return `<svg width="${z}" height="${z}" viewBox="0 0 ${z} ${z}" style="transform:rotate(-90deg)"><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="6"/><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}"/></svg>`};
function item(t,ro){const late=OPEN.includes(t.status)&&t.date<ymd(new Date());
return `<div class="it${late?' late':''}" onclick="openT(${t.id})"><div class="tp"><b class="dot" style="background:${ST[t.status][1]}">${ic(IC[t.status],17)}</b><div><h4>${esc(t.title)}</h4><p>${esc(t.project||'General')}, ${fmt(t)}${t.remind>=0&&OPEN.includes(t.status)?ic('bell',12):''}</p></div></div>`+
(ro?recTxt(t).map(l=>`<p class="rc">${esc(l)}</p>`).join(''):`<div class="ab">${AB.map(a=>`<button style="--c:${ST[a[0]][1]}" class="${t.status==a[0]?'on':''}" onclick="event.stopPropagation();setSt(${t.id},'${a[0]}')">${ic(IC[a[0]],15)}${a[1]}</button>`).join('')}</div>`)+`</div>`}
const nb=(v,l,i)=>`<button class="${view==v?'on':''}" onclick="go('${v}')">${ic(i,24)}<span>${l}</span></button>`;
const navh=()=>nb('home','Home','home')+nb('cal','Calendar','calendar')+`<button class="fab" onclick="openT()" aria-label="Add task">${ic('plus',30)}</button>`+nb('rep','Reports','chart')+`<button onclick="theme()">${ic(S.theme=='dark'?'sun':'moon',24)}<span>${S.theme=='dark'?'Light':'Dark'}</span></button>`;
function go(v){view=v;render();scrollTo(0,0)}
function render(){$('#v').innerHTML=view=='home'?home():view=='cal'?calv():rpt();$('#nav').innerHTML=navh();icons()}
function icons(){document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||17))}

/* ---------- status + records ---------- */
function apply(t,st){t.status=st;t.doneAt=st=='done'?(t.doneAt||ymd(new Date())):'';save();sched(t);render()}
function setSt(id,st){const t=S.tasks.find(x=>x.id==id);if(FIN.includes(st))return openRec(id,st);apply(t,st==t.status&&st=='prog'?'todo':st)}
function openRec(id,st){recId=id;recSt=st;const t=S.tasks.find(x=>x.id==id),r=t.rec||{},c=st=='cancel';
$('#rt').textContent=c?'Cancel task':st=='done'?'Mark as done':'Mark as failed';$('#rs').textContent=t.title;$('#rd').hidden=c;$('#rc').hidden=!c;
RK.forEach((k,i)=>$('#r'+(i+1)).value=r[k]||'');$('#rm').hidden=false}
function saveRec(skip){const t=S.tasks.find(x=>x.id==recId),c=recSt=='cancel';
if(!skip){t.rec={};RK.forEach((k,i)=>{const v=$('#r'+(i+1)).value.trim();if(v&&((k=='reason')==c))t.rec[k]=v})}
$('#rm').hidden=true;apply(t,recSt);toast('Marked as '+ST[recSt][0])}

/* ---------- home ---------- */
function home(){const T=S.tasks,c=k=>T.filter(t=>t.status==k),P={};
T.forEach(t=>{const k=t.project||'General';(P[k]=P[k]||[]).push(t)});
const pj=Object.entries(P).filter(e=>e[1].some(t=>OPEN.includes(t.status))),cols=['var(--g)','var(--o)','#0f5200','#d97a00'];
return `<div class="top"><div class="bar"><button onclick="alerts()" aria-label="Enable alerts">${ic('bell',26)}</button><small>${new Date().toDateString()}</small></div>
<div class="me"><div class="rg">${ring(rate(T),108,'var(--g)')}<div class="av">${ic('drop',34)}</div></div><div><h1>${COMPANY}</h1><p>${rate(T)}% completed</p></div></div></div>
<h2>My Tasks</h2>`+Object.keys(ST).map(k=>`<div class="row${k==filt?' on':''}" onclick="filt='${k}';render()"><div class="c" style="background:${ST[k][1]}">${ic(IC[k],24)}</div><div><h3>${ST[k][0]}</h3><p>${c(k).length} tasks</p></div></div>`).join('')+
`<h2>${ST[filt][0]}</h2><div class="lst">${srt(c(filt)).map(t=>item(t)).join('')||'<p class="em">No tasks here. Tap + to add one.</p>'}</div>
<h2>Active Projects</h2><div class="pg">${pj.map((e,i)=>{const p=rate(e[1]),d=e[1].filter(t=>t.status=='done').length;return `<div class="pc" style="background:${cols[i%4]}"><div class="rg">${ring(p,84,'#fff')}<b>${p}%</b></div><div><h4>${esc(e[0])}</h4><p>${d} of ${e[1].length} tasks done</p></div></div>`}).join('')||'<p class="em">Add a task with a project name to see it here.</p>'}</div>`}

/* ---------- calendar ---------- */
function mv(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);render()}
function calv(){const y=cal.getFullYear(),m=cal.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),td=ymd(new Date());
let g=['M','T','W','T','F','S','S'].map(d=>`<i class="wd">${d}</i>`).join('')+'<i></i>'.repeat(off);
for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d));g+=`<button class="d${k==selDay?' sel':''}${k==td?' td':''}" onclick="selDay='${k}';render()">${d}<span>${S.tasks.filter(t=>t.date==k).slice(0,3).map(t=>`<s style="background:${k==selDay?'#fff':ST[t.status][1]}"></s>`).join('')}</span></button>`}
const L=srt(S.tasks.filter(t=>t.date==selDay));
return `<div class="top"><div class="bar"><b>Calendar</b><button class="tdy" onclick="cal=new Date();selDay=ymd(new Date());render()">Today</button></div></div>
<div class="pn"><button onclick="mv(-1)">${ic('left',24)}</button><h3>${cal.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button onclick="mv(1)">${ic('right',24)}</button></div><div class="cal">${g}</div>
<h2>${pd(selDay).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h2><div class="lst">${L.map(t=>item(t)).join('')||'<p class="em">Nothing planned for this day.</p>'}</div>
<div class="acts"><button class="btn" onclick="openT(0,selDay)">${ic('plus',18)}Add task on this day</button></div>`}

/* ---------- reports ---------- */
function range(){const n=new Date();let a,b;if(rep=='week'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+repOff*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6)}else{a=new Date(n.getFullYear(),n.getMonth()+repOff,1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}return[a,b]}
function rdata(){const[a,b]=range(),td=ymd(new Date()),T=srt(S.tasks.filter(t=>t.date>=ymd(a)&&t.date<=ymd(b))),n=k=>T.filter(t=>t.status==k).length,P={};
T.forEach(t=>{const k=t.project||'General';(P[k]=P[k]||[]).push(t)});
return{T,P,tot:T.length,done:n('done'),prog:n('prog'),todo:n('todo'),fail:n('fail'),cancel:n('cancel'),late:T.filter(t=>OPEN.includes(t.status)&&t.date<td).length,pct:rate(T),title:rep=='week'?short(a)+' to '+short(b)+' '+b.getFullYear():a.toLocaleDateString(undefined,{month:'long',year:'numeric'})}}
function rtext(){const r=rdata();let s=`${COMPANY}: ${rep=='week'?'Weekly':'Monthly'} report\n${r.title}\n\nTotal ${r.tot} | Done ${r.done} | In progress ${r.prog} | To do ${r.todo} | Failed ${r.fail} | Canceled ${r.cancel} | Overdue ${r.late}\nCompletion rate (excluding canceled): ${r.pct}%\n\nBy project\n`;
Object.entries(r.P).forEach(e=>s+=`- ${e[0]}: ${e[1].filter(t=>t.status=='done').length}/${e[1].length} done\n`);s+='\nTasks\n';
r.T.forEach(t=>{s+=`[${ST[t.status][0]}] ${t.date} ${t.time||''} ${t.title} (${t.project||'General'})\n`;recTxt(t).forEach(l=>s+=`    ${l}\n`)});return s}
const PCOL={todo:[255,125,32],prog:[232,137,12],done:[24,125,0],fail:[214,69,69],cancel:[125,119,107]};
function pdfReport(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
const r=rdata(),d=new J({unit:'mm',format:'a4'}),W=210,H=297,M=14,O=[255,125,32],G=[24,125,0],K=[18,34,63],GR=[120,115,105],cx=[M+2,M+34,M+116,M+156];let y=0;
const tc=c=>d.setTextColor(c[0],c[1],c[2]),fc=c=>d.setFillColor(c[0],c[1],c[2]),F=(w,z)=>{d.setFont('helvetica',w);d.setFontSize(z)};
fc(O);d.roundedRect(-10,-12,W+20,56,10,10,'F');tc([255,255,255]);F('bold',22);d.text(COMPANY,M,19);F('normal',12);d.text((rep=='week'?'Weekly':'Monthly')+' task report',M,27);F('bold',11);d.text(r.title,M,35);
y=52;const B=[['Total',r.tot,K],['Completed',r.pct+'%',G],['Open',r.prog+r.todo,O],['Overdue',r.late,[229,72,77]],['Failed',r.fail,PCOL.fail],['Canceled',r.cancel,PCOL.cancel]],bw=(W-2*M-15)/6;
B.forEach((b,i)=>{const x=M+i*(bw+3);fc([255,244,228]);d.roundedRect(x,y,bw,20,3,3,'F');tc(b[2]);F('bold',16);d.text(String(b[1]),x+bw/2,y+10,{align:'center'});tc(GR);F('normal',7.5);d.text(b[0],x+bw/2,y+16,{align:'center'})});
y+=30;tc(K);F('bold',13);d.text('By project',M,y);y+=6;
Object.entries(r.P).forEach(e=>{if(y+12>H-20){d.addPage();y=18}const p=rate(e[1]),dn=e[1].filter(t=>t.status=='done').length;tc(K);F('bold',9.5);d.text(e[0],M,y+3);tc(GR);F('normal',9);d.text(dn+'/'+e[1].length+' done ('+p+'%)',W-M,y+3,{align:'right'});fc([234,223,203]);d.roundedRect(M,y+5,W-2*M,2.6,1.3,1.3,'F');if(p){fc(G);d.roundedRect(M,y+5,(W-2*M)*p/100,2.6,1.3,1.3,'F')}y+=12});
if(!r.tot){tc(GR);F('normal',10);d.text('No tasks in this period.',M,y+3)}
else{y+=4;if(y+30>H-20){d.addPage();y=18}tc(K);F('bold',13);d.text('Tasks',M,y);y+=4;
const head=()=>{fc(K);d.rect(M,y,W-2*M,7,'F');tc([255,255,255]);F('bold',8.5);['DUE','TASK','PROJECT','STATUS'].forEach((h,i)=>d.text(h,cx[i],y+4.8));y+=7};head();
r.T.forEach((t,i)=>{F('bold',9);const tl=d.splitTextToSize(t.title,76),pl=d.splitTextToSize(t.project||'General',34);F('normal',8);const rl=recTxt(t).flatMap(l=>d.splitTextToSize(l,76)),h=Math.max(tl.length,pl.length)*4.2+rl.length*3.6+4;
if(y+h>H-20){d.addPage();y=18;head()}
if(i%2==0){fc([255,248,236]);d.rect(M,y,W-2*M,h,'F')}
tc(K);F('normal',8.5);d.text([t.date,t.time||''],cx[0],y+4.5);F('bold',9);d.text(tl,cx[1],y+4.5);F('normal',8.5);d.text(pl,cx[2],y+4.5);tc(PCOL[t.status]);F('bold',8.5);d.text(ST[t.status][0],cx[3],y+4.5);
tc(GR);F('normal',8);rl.forEach((l,j)=>d.text(l,cx[1],y+4.5+tl.length*4.2+j*3.6+1));y+=h})}
const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);tc(GR);F('normal',8);d.text(COMPANY+' - generated '+new Date().toLocaleDateString(),M,H-9);d.text('Page '+i+' of '+n,W-M,H-9,{align:'right'})}
return d}
async function share(){const r=rdata(),P=window.Capacitor&&Capacitor.Plugins,nm='Synthesis-'+(rep=='week'?'Weekly':'Monthly')+'-Report-'+r.title.replace(/[^A-Za-z0-9]+/g,'-')+'.pdf',ttl=COMPANY+' '+(rep=='week'?'weekly':'monthly')+' report';
try{const d=pdfReport();
if(d&&P&&P.Filesystem&&P.Share){const f=await P.Filesystem.writeFile({path:nm,data:d.output('datauristring').split(',')[1],directory:'CACHE'});await P.Share.share({title:ttl,text:ttl+' ('+r.title+')',files:[f.uri],dialogTitle:'Share report'});return}
if(d){const file=new File([d.output('blob')],nm,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:ttl});else d.save(nm);return}
if(P&&P.Share)await P.Share.share({title:ttl,text:rtext()});else{await navigator.clipboard.writeText(rtext());toast('PDF tools missing. Report copied as text.')}
}catch(e){const m=String(e&&e.message||e);if(!/cancel/i.test(m))toast('Could not share PDF: '+m,6000)}}
async function copyR(){try{await navigator.clipboard.writeText(rtext());toast('Report copied')}catch(e){toast('Copy not available. Use Share.')}}
function rpt(){const r=rdata();
return `<div class="top"><div class="bar"><b>Reports</b></div><div class="seg"><button class="${rep=='week'?'on':''}" onclick="rep='week';repOff=0;render()">Weekly</button><button class="${rep=='month'?'on':''}" onclick="rep='month';repOff=0;render()">Monthly</button></div></div>
<div class="pn"><button onclick="repOff--;render()">${ic('left',24)}</button><h3>${r.title}</h3><button onclick="repOff++;render()">${ic('right',24)}</button></div>
<div class="sg"><div><b>${r.tot}</b><p>Total tasks</p></div><div><b style="color:var(--g)">${r.pct}%</b><p>Completed (${r.done})</p></div><div><b style="color:var(--o)">${r.prog+r.todo}</b><p>Still open</p></div><div><b style="color:#e5484d">${r.late}</b><p>Overdue</p></div><div><b style="color:#d64545">${r.fail}</b><p>Failed</p></div><div><b style="color:#7d776b">${r.cancel}</b><p>Canceled</p></div></div>
<h2>By project</h2>${Object.entries(r.P).map(e=>`<div class="br"><h4>${esc(e[0])} <span style="font-weight:400;color:var(--mut)">${e[1].filter(t=>t.status=='done').length}/${e[1].length}</span></h4><i><s style="width:${rate(e[1])}%"></s></i></div>`).join('')||'<p class="em">No tasks in this period.</p>'}
<h2>Tasks</h2><div class="lst">${r.T.map(t=>item(t,1)).join('')}</div>
<div class="acts"><button class="btn" onclick="share()">${ic('share',18)}Share PDF</button><button class="btn o" onclick="copyR()">${ic('copy',18)}Copy text</button></div>`}

/* ---------- add / edit ---------- */
function openT(id,day){eid=id||0;const t=S.tasks.find(x=>x.id==id)||{title:'',project:'',date:day||ymd(new Date()),time:'',remind:10,notes:''};
$('#mt').textContent=id?'Edit task':'New task';$('#ft').value=t.title;$('#fp').value=t.project||'';$('#fd').value=t.date;$('#ftm').value=t.time||'';$('#fr').value=t.remind;$('#fn').value=t.notes||'';$('#fx').hidden=!id;
$('#pl').innerHTML=[...new Set(S.tasks.map(x=>x.project).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join('');$('#m').hidden=false}
const closeT=()=>$('#m').hidden=true;
function saveT(){const title=$('#ft').value.trim(),date=$('#fd').value;if(!title||!date)return toast('Add a title and a date');
let t=S.tasks.find(x=>x.id==eid);if(!t){let id=Math.floor(Date.now()/1000);while(S.tasks.some(x=>x.id==id))id++;t={id,status:'todo'};S.tasks.push(t)}
Object.assign(t,{title,project:$('#fp').value.trim(),date,time:$('#ftm').value,remind:+$('#fr').value,notes:$('#fn').value});
save();sched(t);closeT();selDay=date;render();toast('Task saved')}
function delT(){if(!confirm('Delete this task?'))return;S.tasks=S.tasks.filter(x=>x.id!=eid);save();unsched(eid);closeT();render()}
applyTheme();render();initN();
</script></body></html>
