<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff7d20"><title>Synthesis Tasks</title><style>
:root{--o:rgb(255 125 32);--g:rgb(24 125 0);--bg:#fff8ec;--card:#fff;--ink:#12223f;--mut:#8b8577;--trk:#eadfcb;--ln:#e8dcc6}

.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}.sg div{background:var(--card);border-radius:22px;padding:14px}.sg b{font-size:25px;display:block}
.br{padding:6px 22px}.br i{display:block;height:10px;border-radius:6px;background:var(--trk);margin-top:5px;overflow:hidden}.br i s{display:block;height:100%;background:var(--g)}
.btn{background:var(--g);color:#fff;border-radius:20px;padding:13px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.o{background:var(--o)}.btn.m{background:var(--mut)}

.sh input,.sh select,.sh textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sh input{min-width:0}.fl{display:grid;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:center}
label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
#t{position:fixed;top:max(env(safe-area-inset-top),16px);left:50%;transform:translateX(-50%);background:#12223f;color:#fff;border:1px solid rgba(255,255,255,.25);padding:12px 18px;border-radius:16px;z-index:20;max-width:90%}
.out nav{display:none}.out{padding-bottom:20px}
.sh{animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
.mo{backdrop-filter:blur(3px)}.sh>*{min-width:0}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:-8px auto 2px}
.lb{font-size:11.5px;font-weight:700;letter-spacing:.9px;color:var(--mut);text-transform:uppercase;margin-top:4px}

.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.av2{width:22px;height:22px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:11px}
.sh .big{font-size:21px;font-weight:700;border:0;background:none;padding:4px 0}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:0 12px;color:var(--mut)}
.sh .pill input{border:0;background:none;padding:12px 0;min-width:0;border-radius:0}
.mr{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--card);font-weight:600;margin-top:8px}
.fi,.sel2{width:100%;font:inherit;padding:14px;border:1.5px solid var(--ln);border-radius:16px;background:var(--card);color:var(--ink)}
.sg2{display:flex;background:var(--trk);border-radius:18px;padding:4px;margin:0 20px 10px}.sg2 button{flex:1;padding:8px;border-radius:14px;font-weight:600;font-size:13px}.sg2 .on{background:var(--card);color:var(--g)}
</style></head><body>
<div id="v"></div><nav id="nav"></nav>
<div class="mo" id="m" hidden onclick="if(event.target===this)closeT()"><div class="sh"><i class="grab"></i>
<div class="hd"><h3 id="mt">New task</h3><button onclick="closeT()" aria-label="Close"><span data-i="x" data-s="24"></span></button></div>
<input id="ft" class="big" placeholder="What needs to be done?">
<div class="lb">When</div><div class="chips" id="qd"></div>
<div class="two"><label class="pill"><span data-i="calendar"></span><input id="fd" type="date" onchange="drawChips()"></label><label class="pill"><span data-i="clock"></span><input id="ftm" type="time"></label></div>
<div class="lb">Remind me</div><div class="chips" id="rc2"></div>
<div class="lb">Project</div><input id="fp" placeholder="Project or client site" onchange="drawChips()"><div class="chips" id="pj"></div>
<div class="lb">Assign to</div><div class="chips" id="as"></div>
<textarea id="fn" rows="2" placeholder="Notes (optional)"></textarea>
<div class="acts" style="padding:0"><button class="btn" style="flex:3" onclick="saveT()">Save task</button><button class="btn o" id="fx" onclick="delT()" aria-label="Delete task"><span data-i="trash" data-s="20"></span></button></div></div></div>
<div class="mo" id="um" hidden onclick="if(event.target===this)this.hidden=true"><div class="sh"><i class="grab"></i><div class="hd"><h3 id="ut">Add user</h3><button onclick="$('#um').hidden=true" aria-label="Close"><span data-i="x" data-s="24"></span></button></div>
<input id="un" placeholder="Full name"><input id="ue" type="email" placeholder="Email address"><input id="up" placeholder="Temporary password (6+ characters)">
<div class="lb">Role</div><div class="chips" id="ur"></div>
<input id="ud" list="dl" placeholder="Department (e.g. Design, Field Operations)"><datalist id="dl"></datalist>
<div class="acts" style="padding:0"><button class="btn" onclick="saveU()">Save</button><button class="btn o" id="ux" onclick="togU()">Remove</button></div></div></div>
<div class="mo" id="mn" hidden onclick="if(event.target===this)this.hidden=true"><div class="sh"><i class="grab"></i><div id="mc"></div></div></div>
<div class="mo" id="rm" hidden><div class="sh"><div class="hd"><h3 id="rt"></h3><button onclick="$('#rm').hidden=true" aria-label="Close"><span data-i="x" data-s="24"></span></button></div><p id="rs"></p>
<div id="rd" class="fl">
<label><span data-i="tool"></span>Tools used (optional)</label><textarea id="r1" rows="2" placeholder="e.g. Pipe cutter, trencher, flow meter"></textarea>
<label><span data-i="alert"></span>Challenges (optional)</label><textarea id="r2" rows="2" placeholder="What made the job difficult?"></textarea>
<label><span data-i="bulb"></span>Suggestions (optional)</label><textarea id="r3" rows="2" placeholder="What could be done better next time?"></textarea>
<label><span data-i="note"></span>Other (optional)</label><textarea id="r4" rows="2" placeholder="Anything else to record"></textarea></div>
<div id="rc" class="fl" hidden><label><span data-i="ban"></span>Reason for canceling</label><textarea id="r5" rows="3" placeholder="Why was this task canceled?"></textarea></div>
<div class="acts" style="padding:0"><button class="btn" onclick="saveRec()">Save</button><button class="btn m" onclick="saveRec(1)">Skip</button></div></div></div>
<div id="t" hidden></div>
<script src="config.js"></script><script src="firebase-app-compat.js"></script><script src="firebase-auth-compat.js"></script><script src="firebase-firestore-compat.js"></script><script src="jspdf.umd.min.js"></script>
<script>
const COMPANY='Synthesis Tasks',KEY='irritask.v1',$=s=>document.querySelector(s);
const I={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<path d="M5 20v-8M12 20V5M19 20V9"/>',bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',prog:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',tool:'<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',alert:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',note:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h5"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0114 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 015 5"/>',logout:'<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ST={todo:['To Do','var(--o)'],prog:['In Progress','#e8890c'],done:['Done','var(--g)'],fail:['Failed','#d64545'],cancel:['Canceled','#7d776b']};
const IC={todo:'clock',prog:'prog',done:'check',fail:'x',cancel:'ban'},OPEN=['todo','prog'],FIN=['done','fail','cancel'];
const AB=[['prog','Start'],['done','Done'],['fail','Failed'],['cancel','Cancel']];
const RL=[['tools','Tools used'],['challenges','Challenges'],['suggest','Suggestions'],['other','Other'],['reason','Reason']],RK=RL.map(r=>r[0]);
let S=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"fired":{}}'),view='home',filt='todo',cal=new Date(),rep='week',repOff=0,eid=0,recId=0,recSt='',selDay='';
let U=null,USERS=[],unsubs=[],db,au,scope='mine',repWho='me',teamSel='all',fR=10,fA='',uid_='',uR='employee',lmsg='';S.tasks=[];S.fired=S.fired||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify({theme:S.theme,fired:S.fired}));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-');return new Date(a[0],a[1]-1,a[2])};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const short=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmt=t=>short(pd(t.date))+' '+pd(t.date).getFullYear()+(t.time?' at '+t.time:'');
const srt=a=>a.sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
const rate=a=>{const n=a.filter(t=>t.status!='cancel').length;return n?Math.round(a.filter(t=>t.status=='done').length/n*100):0};
const recTxt=t=>FIN.includes(t.status)&&t.rec?RL.filter(r=>t.rec[r[0]]&&(r[0]=='reason')==(t.status=='cancel')).map(r=>r[1]+': '+t.rec[r[0]]):[];
selDay=ymd(new Date());
const applyTheme=()=>document.documentElement.dataset.theme=S.theme||'light';
function theme(){S.theme=S.theme=='dark'?'light':'dark';save();applyTheme();render()}

/* ---------- sound + notifications ---------- */
function chime(){try{const A=new(window.AudioContext||window.webkitAudioContext)();[[659,0],[880,.16],[1175,.32],[880,.5],[1319,.68]].forEach(([f,t])=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.connect(g);g.connect(A.destination);const s=A.currentTime+t;g.gain.setValueAtTime(.4,s);g.gain.exponentialRampToValueAtTime(.001,s+.9);o.start(s);o.stop(s+.9)})}catch(e){}}
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const nid=t=>{let h=0;for(const c of String(t.id))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2147483000};
const when=t=>new Date(t.date+'T'+(t.time||'08:00')).getTime()-t.remind*60000;
async function sched(t){const L=LN();if(!L||!U||t.assignee!=U.uid)return;try{await L.cancel({notifications:[{id:nid(t)}]});if(t.remind>=0&&OPEN.includes(t.status)&&when(t)>Date.now())await L.schedule({notifications:[{id:nid(t),title:'⏰ '+t.title,body:(t.project||'Task')+', due '+fmt(t),schedule:{at:new Date(when(t)),allowWhileIdle:true},channelId:'irri',sound:'irri_alert.wav',smallIcon:'ic_stat_synth',iconColor:'#FF7D20'}]})}catch(e){}}
async function unsched(id){const L=LN();if(L)try{await L.cancel({notifications:[{id}]})}catch(e){}}
async function initN(){const L=LN();if(!L)return;try{await L.requestPermissions();await L.createChannel({id:'irri',name:'Task reminders',description:'Task alerts',importance:5,sound:'irri_alert.wav',vibration:true});S.tasks.forEach(sched)}catch(e){}}
async function alerts(){await initN();chime();toast('Alerts on. This is your reminder sound.')}
setInterval(()=>{if(LN())return;const n=Date.now();S.tasks.forEach(t=>{if(!U||t.assignee!=U.uid||t.remind<0||!OPEN.includes(t.status))return;const w=when(t),k=t.id+'_'+w;if(w<=n&&n-w<6e5&&!S.fired[k]){S.fired[k]=1;save();chime();toast('⏰ '+t.title,8000)}})},15000);
let tt;function toast(m,ms=3500){const e=$('#t');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,ms)}

/* ---------- shared ui ---------- */
const ring=(p,z,col)=>{const r=z/2-6,L=2*Math.PI*r;return `<svg width="${z}" height="${z}" viewBox="0 0 ${z} ${z}" style="transform:rotate(-90deg)"><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="6"/><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}"/></svg>`};
const canEdit=t=>!!U&&(t.assignee==U.uid||t.createdBy==U.uid||U.role=='admin');
function item(t,ro){const late=OPEN.includes(t.status)&&t.date<ymd(new Date()),ed=canEdit(t),who=t.assignee!=U.uid?' · '+esc(t.assigneeName||''):(t.createdBy!=U.uid?' · from '+esc(t.createdByName||''):'');
return `<div class="it${late?' late':''}"${ed?` onclick="openT('${t.id}')"`:''}><div class="tp"><b class="dot" style="background:${ST[t.status][1]}">${ic(IC[t.status],17)}</b><div><h4>${esc(t.title)}</h4><p>${esc(t.project||'General')}, ${fmt(t)}${who}${t.remind>=0&&OPEN.includes(t.status)&&t.assignee==U.uid?ic('bell',12):''}</p></div></div>`+
(ro||!ed?recTxt(t).map(l=>`<p class="rc">${esc(l)}</p>`).join(''):`<div class="ab">${AB.map(a=>`<button style="--c:${ST[a[0]][1]}" class="${t.status==a[0]?'on':''}" onclick="event.stopPropagation();setSt('${t.id}','${a[0]}')">${ic(IC[a[0]],15)}${a[1]}</button>`).join('')}</div>`)+`</div>`}
const nb=(v,l,i)=>`<button class="${view==v?'on':''}" onclick="go('${v}')">${ic(i,24)}<span>${l}</span></button>`;
const navh=()=>nb('home','Home','home')+nb('cal','Calendar','calendar')+`<button class="fab" onclick="openT()" aria-label="Add task">${ic('plus',30)}</button>`+nb('rep','Reports','chart')+`<button onclick="theme()">${ic(S.theme=='dark'?'sun':'moon',24)}<span>${S.theme=='dark'?'Light':'Dark'}</span></button>`;
function go(v){view=v;render();scrollTo(0,0)}
function render(){document.body.classList.toggle('out',!U);$('#v').innerHTML=!U?loginv():view=='home'?home():view=='cal'?calv():view=='rep'?rpt():view=='team'?teamv():usersv();$('#nav').innerHTML=navh();icons()}

/* ---------- status + records ---------- */

function start(){lmsg='';view='home';S.tasks=[];USERS=[];const maps=[];
const hook=q=>{const m=new Map();maps.push(m);unsubs.push(q.onSnapshot(sn=>{sn.docChanges().forEach(c=>{const t=Object.assign({},c.doc.data(),{id:c.doc.id});
if(c.type=='removed'){m.delete(t.id);unsched(nid(t));return}
const had=S.tasks.some(x=>x.id==t.id);m.set(t.id,t);sched(t);
if(!had&&c.type=='added'&&t.assignee==U.uid&&t.createdBy!=U.uid&&t.created&&t.created.toMillis&&Date.now()-t.created.toMillis()<12e4&&!S.fired['n'+t.id]){S.fired['n'+t.id]=1;save();chime();toast('New task from '+t.createdByName+': '+t.title,6000)}});
const all=new Map();maps.forEach(x=>x.forEach((v,k)=>all.set(k,v)));S.tasks=[...all.values()];render()},e=>toast('Sync error: '+e.message,6000)))};
const T=db.collection('tasks');
if(U.role=='admin')hook(T);else{hook(T.where('assignee','==',U.uid));hook(T.where('createdBy','==',U.uid));if(U.role=='manager'&&U.dept)hook(T.where('dept','==',U.dept))}
unsubs.push(db.collection('users').onSnapshot(sn=>{USERS=sn.docs.map(d=>Object.assign({},d.data(),{uid:d.id}));render()}));
initN();render()}
function boot(){const C=window.FIREBASE_CONFIG;if(!window.firebase||!C||!C.apiKey||/^PASTE/.test(C.apiKey)){lmsg='Setup needed: add your Firebase details to config.js and rebuild.';return render()}

try{const d=await db.collection('users').doc(u.uid).get(),p=d.data();if(!p||p.active===false){lmsg='This account has no access. Ask your administrator.';await au.signOut();return}
U=Object.assign({},p,{uid:u.uid});start()}catch(e){lmsg='Could not load your profile ('+(e.code||e.message)+')';await au.signOut()}})}

async function togU(){const u=USERS.find(x=>x.uid==uid_);if(!u)return;if(u.active!==false&&!confirm('Remove '+u.name+'? They will no longer be able to use the app.'))return;try{await db.collection('users').doc(uid_).update({active:u.active===false});$('#um').hidden=true}catch(e){toast(e.message,6000)}}

/* ---------- add / edit task ---------- */
const qd=n=>{const x=new Date();x.setDate(x.getDate()+n);$('#fd').value=ymd(x);drawChips()};
function drawChips(){const d=$('#fd').value,a=n=>{const x=new Date();x.setDate(x.getDate()+n);return ymd(x)};
$('#qd').innerHTML=[['Today',0],['Tomorrow',1],['Next week',7]].map(q=>chip(d==a(q[1]),`qd(${q[1]})`,q[0])).join('');
$('#rc2').innerHTML=[[-1,'None'],[0,'At time'],[10,'10 min before'],[60,'1 hour before'],[1440,'1 day before']].map(r=>chip(fR==r[0],`fR=${r[0]};drawChips()`,r[1])).join('');
$('#pj').innerHTML=[...new Set(S.tasks.map(x=>x.project).filter(Boolean))].slice(0,8).map(p=>chip($('#fp').value==p,"$('#fp').value=this.textContent;drawChips()",esc(p))).join('');
$('#as').innerHTML=actU().map(u=>chip(fA==u.uid,`fA='${u.uid}';drawChips()`,u.uid==U.uid?'Me':esc((u.name||'').split(' ')[0]),av2(u))).join('')}
function openT(id,day){eid=id||'';const t=S.tasks.find(x=>x.id==id)||{title:'',project:'',date:day||ymd(new Date()),time:'',remind:10,notes:'',assignee:U.uid};
fR=t.remind;fA=t.assignee;$('#mt').textContent=id?'Edit task':'New task';$('#ft').value=t.title;$('#fp').value=t.project||'';$('#fd').value=t.date;$('#ftm').value=t.time||'';$('#fn').value=t.notes||'';$('#fx').hidden=!(id&&(t.createdBy==U.uid||U.role=='admin'));
drawChips();$('#m').hidden=false;if(!id)setTimeout(()=>$('#ft').focus(),300)}
const closeT=()=>$('#m').hidden=true;
function saveT(){const title=$('#ft').value.trim(),date=$('#fd').value;if(!title||!date)return toast('Add a title and a date');
const a=USERS.find(u=>u.uid==fA)||U,o={title,project:$('#fp').value.trim(),date,time:$('#ftm').value,remind:fR,notes:$('#fn').value,assignee:a.uid,assigneeName:a.name,dept:a.dept||''},T=db.collection('tasks');
(eid?T.doc(eid).update(o):T.add(Object.assign(o,{status:'todo',createdBy:U.uid,createdByName:U.name,created:firebase.firestore.FieldValue.serverTimestamp()}))).catch(e=>toast('Not saved: '+e.message,6000));
closeT();selDay=date;toast(a.uid==U.uid?'Task saved':'Task assigned to '+a.name)}
function delT(){if(!confirm('Delete this task?'))return;db.collection('tasks').doc(eid).delete().catch(e=>toast(e.message,6000));closeT()}
applyTheme();render();boot();
